name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk'
          - 'bundle'

jobs:
  release:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'apk' }}
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB Bundle
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'bundle' }}
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      # Sign with release keystore if GitHub Secrets are provided
      - name: Prepare Keystore from Secret
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Sign Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' && (inputs.build_target == 'all' || inputs.build_target == 'apk') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          $ANDROID_BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release-aligned.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          $ANDROID_BUILD_TOOLS/apksigner sign --ks android/app/release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          rm -f android/app/release.keystore

      - name: Upload Release APK
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release AAB
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
